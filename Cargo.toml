[workspace]
members = [
    "kernel",
    "kernel/macros",
    "drivers",
    "codegen",
    "modelcheck",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
kdl = "6.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v7"] }
linkme = "0.3"
proptest = "1.11"
syn = "2"
quote = "1"
proc-macro2 = "1"
trybuild = "1"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
