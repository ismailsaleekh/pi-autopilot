name: release-certification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-host-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rust workspace build
        run: cargo build --workspace
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Host typecheck
        run: npx tsc --noEmit -p host/tsconfig.json
      - name: Gates selftest
        run: ./scripts/gates/selftest.sh
      - name: Gate loc core
        run: ./scripts/gates/loc.sh core
      - name: Gate loc tooling
        run: ./scripts/gates/loc.sh tooling
      - name: Gate kernel purity
        run: ./scripts/gates/kernel-purity.sh
      - name: Gate no inference
        run: ./scripts/gates/no-inference.sh
      - name: Gate host thinness
        run: ./scripts/gates/host-thinness.sh --root "$PWD/host"
      - name: Full Rust tests
        run: cargo test -q
      - name: Host tests
        run: node --experimental-strip-types --test host/tests/*.test.ts
      - name: Codegen check
        run: cargo run -p codegen -- --check
      - name: Modelcheck
        run: cargo run -p modelcheck
      - name: Disposition check
        run: node scripts/check-disposition.mjs
      - name: Kernel freeze
        run: git diff --exit-code ea802a3 -- kernel/
      - name: Package dry run
        run: npm run build && npm run pack:dry-run

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:scan
      - run: npm run security:audit
      - run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: security-and-sbom
          path: artifacts/security/*.json
          if-no-files-found: error
