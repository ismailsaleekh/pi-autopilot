name: release-certification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-host-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rust workspace build
        run: cargo build --workspace
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Host typecheck
        run: npx tsc --noEmit -p host/tsconfig.json
      - name: Gates selftest
        run: ./scripts/gates/selftest.sh
      - name: Gate loc core
        run: ./scripts/gates/loc.sh core
      - name: Gate loc tooling
        run: ./scripts/gates/loc.sh tooling
      - name: Gate kernel purity
        run: ./scripts/gates/kernel-purity.sh
      - name: Gate no inference
        run: ./scripts/gates/no-inference.sh
      - name: Gate host thinness
        run: ./scripts/gates/host-thinness.sh
      - name: Full Rust tests
        run: cargo test -q
      - name: Host tests
        run: node --experimental-strip-types --test host/tests/*.test.ts
      - name: Codegen check
        run: cargo run -p codegen -- --check
      - name: Modelcheck
        run: cargo run -p modelcheck
      - name: Disposition check
        run: node scripts/check-disposition.mjs
      - name: Kernel freeze
        run: git diff --exit-code ea802a3 -- kernel/
      - name: Package dry run
        run: npm run build && npm run pack:dry-run

  core-binary-matrix:
    name: core binary ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: autopilot-core
          - platform: darwin
            arch: x64
            runner: macos-13
            target: x86_64-apple-darwin
            binary: autopilot-core
          - platform: linux
            arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: autopilot-core
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: autopilot-core
          - platform: win32
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: autopilot-core.exe
    env:
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: Build release core
        run: cargo build --release -p drivers --bin autopilot-core --target ${{ matrix.target }}
      - name: Stage platform binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "binaries/${{ matrix.platform }}-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "binaries/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.binary }}"
          test -s "binaries/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: autopilot-core-${{ matrix.platform }}-${{ matrix.arch }}
          path: binaries/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.binary }}
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:scan
      - run: npm run security:audit
      - run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: security-and-sbom
          path: artifacts/security/*.json
          if-no-files-found: error
